<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Cafe - Contact</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar md:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Bloom Cafe</a>
    <button class="btn-icon navbar-toggler" type="button"
      data-bs-toggle="drawer" data-bs-target="#menu"
      aria-controls="menu" aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <dialog class="drawer drawer-end" id="menu" aria-labelledby="menuTitle">
      <div class="drawer-header">
        <h5 id="menuTitle">Menu</h5>
        <button class="btn-close" type="button"
          data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>

<main class="container my-4">
  <h1>Contact Us</h1>
  <p>Fill out the form below.</p>

  <form action="#" method="get">
    <div class="row g-4">

      <div class="col-12 md:col-6">
        <div class="form-field">
          <label class="form-label" for="firstName">First Name</label>
          <input class="form-control" type="text" id="firstName" name="firstName" required>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="form-field">
          <label class="form-label" for="lastName">Last Name</label>
          <input class="form-control" type="text" id="lastName" name="lastName" required>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="form-field">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="form-field">
          <label class="form-label" for="topic">Topic</label>
          <select class="form-control" id="topic" name="topic" required>
            <option value="">Choose a topic</option>
            <option value="drinks">Drinks</option>
            <option value="food">Food</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="form-field">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="form-field">
          <input class="check" type="checkbox" id="consent" name="consent" required>
          <label for="consent">I agree to be contacted.</label>
        </div>
      </div>

      <div class="col-12">
        <button class="btn-solid theme-primary" type="submit">Submit</button>
      </div>

    </div>
  </form>
</main>

<footer class="bg-1 text-center p-3">
  <p>Bloom Cafe - 2026</p>
</footer>

<script type="module" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
